mytestkey=This value is from LOCAL properties file

paypal.client.id=${P_CLIENT_ID}

paypal.client.secret=${P_CLIENT_SECRET}

paypal.oauth.url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.createOrder.url=https://api-m.sandbox.paypal.com/v2/checkout/orders

paypal.captureOrder.url.template=https://api-m.sandbox.paypal.com/v2/checkout/orders/{orderId}/capture

# ========= Eureka Client Configuration =========
# URL of the Eureka Server where this microservice will register itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register this microservice into Eureka Service Registry
eureka.client.register-with-eureka=true

# Fetch details of all registered services from Eureka
# so this service can discover and call other microservices
eureka.client.fetch-registry=true

# Send a heartbeat to Eureka Server every 5 seconds to renew this service instance's lease 
eureka.instance.lease-renewal-interval-in-seconds=5

# Remove service instance if heartbeat is not received within 10 seconds
# (default is 90 seconds)
eureka.instance.lease-expiration-duration-in-seconds=10

# Register service using IP address instead of hostname
# Useful in cloud, Docker, and VM environments
eureka.instance.prefer-ip-address=true

# Unique instance ID for this microservice instance
# Format: application-name:ip-address:port
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# Actuator config

# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info

# Show complete health details
management.endpoint.health.show-details=when-authorized

