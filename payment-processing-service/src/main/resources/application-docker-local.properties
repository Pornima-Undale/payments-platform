mytestkey=This value is from LOCAL properties file

spring.datasource.url=${DB_URL:jdbc:mysql://host.docker.internal:3306/payments}
spring.datasource.username=${DB_USERNAME:payments_user}
spring.datasource.password=${DB_PASSWORD}
		 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

paypal.provider.createOrder.url=http://paypal-provider-service/v1/orders
paypal.provider.captureOrder.url.template=http://paypal-provider-service/v1/orders/{orderId}/capture

# Expose all Spring Boot Actuator endpoints
management.endpoints.web.exposure.include=health,info

# Enable the /actuator/health endpoint
management.endpoint.health.enabled=true

# Include Circuit Breaker health information in /actuator/health
management.health.circuitbreakers.enabled=true

# Always show detailed health information
management.endpoint.health.show-details=when-authorized


# Resilience4j Circuit Breaker configurations
resilience4j.circuitbreaker.instances.payment-processing-service.failureRateThreshold=40
resilience4j.circuitbreaker.instances.payment-processing-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.payment-processing-service.waitDurationInOpenState=300s
resilience4j.circuitbreaker.instances.payment-processing-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.payment-processing-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.payment-processing-service.permittedNumberOfCallsInHalfOpenState=2
 
resilience4j.circuitbreaker.instances.payment-processing-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.payment-processing-service.slidingWindowType=COUNT_BASED


# ========= Eureka Client Configuration =========
# URL of the Eureka Server where this microservice will register itself
eureka.client.service-url.defaultZone=http://eureka-sr-con:8761/eureka

# Register this microservice into Eureka Service Registry
eureka.client.register-with-eureka=true

# Fetch details of all registered services from Eureka
# so this service can discover and call other microservices
eureka.client.fetch-registry=true

# Send a heartbeat to Eureka Server every 5 seconds to renew this service instance's lease 
eureka.instance.lease-renewal-interval-in-seconds=5

# Remove service instance if heartbeat is not received within 10 seconds
# (default is 90 seconds)
eureka.instance.lease-expiration-duration-in-seconds=10

# Register service using IP address instead of hostname
# Useful in cloud, Docker, and VM environments
eureka.instance.prefer-ip-address=true

# Unique instance ID for this microservice instance
# Format: application-name:ip-address:port
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

